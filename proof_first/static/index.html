<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProofFirst</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">P</div>
        <span class="label">ProofFirst</span>
      </div>
      <button class="collapse-btn" id="collapseBtn" title="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v18M3 3h18v18H3V3z"/></svg>
      </button>
    </div>

    <div class="sidebar-search" id="openCmdkFromSidebar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="label">Search ProofFirst...</span>
      <kbd>⌘K</kbd>
    </div>

    <nav id="navMain">
      <div class="nav-group">
        <div class="nav-item" data-route="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
          <span class="label">Home</span>
        </div>
        <div class="nav-item" data-route="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span class="label">Inbox</span>
        </div>
        <div class="nav-item" data-route="leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="label">Leads</span>
          <span class="nav-count" id="navLeadsCount"></span>
        </div>
        <div class="nav-item" data-route="companies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V7l6-4 6 4v14M10 21v-6h4v6"/></svg>
          <span class="label">Companies</span>
        </div>
        <div class="nav-item" data-route="evidence">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
          <span class="label">Evidence</span>
        </div>
        <div class="nav-item" data-route="actions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
          <span class="label">Actions</span>
          <span class="nav-count" id="navActionsCount"></span>
        </div>
        <div class="nav-item" data-route="agents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg>
          <span class="label">Agents</span>
        </div>
        <div class="nav-item" data-route="activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="label">Activity</span>
        </div>
      </div>

      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-item" data-route="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>
          <span class="label">Reports</span>
        </div>
        <div class="nav-item" data-route="evaluation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span class="label">Evaluation</span>
        </div>
      </div>

      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-item" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="label">Settings</span>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="status-dot" id="statusDot"></div>
      <span class="label" id="statusLabel">System operational</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">Home</span>
      <span class="topbar-crumb hidden" id="topbarCrumb"></span>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
    <div class="view" id="view"><!-- rendered by app.js --></div>
  </main>
</div>

<!-- ============ SIDE PANEL ============ -->
<div class="overlay" id="overlay"></div>
<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <div class="panel-header-main">
      <div class="panel-eyebrow" id="panelEyebrow"></div>
      <div class="panel-title" id="panelTitle"></div>
    </div>
    <button class="panel-close" id="panelClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-actions hidden" id="panelActions"></div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- ============ COMMAND PALETTE ============ -->
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk">
    <div class="cmdk-input-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="cmdkInput" placeholder="Search leads, evidence, actions..." autocomplete="off" />
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>

<!-- ============ ASK PROOFFIRST ============ -->
<button class="ask-fab" id="askFab">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  Ask ProofFirst
</button>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/static/app.js"></script>
</body>
</html>
